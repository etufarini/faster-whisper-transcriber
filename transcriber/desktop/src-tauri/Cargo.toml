# Cargo.toml
# Keep the process/storage runtime testable without native window dependencies.
[package]
name = "faster-whisper-transcriber"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[lib]
name = "transcriber"

[[bin]]
name = "faster-whisper-transcriber"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tokio"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
native-tests = ["desktop", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.0.0", optional = true }
tokio = { version = "1", features = ["signal", "macros"], optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[profile.dev]
debug = "limited"
incremental = false
