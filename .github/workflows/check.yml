# check.yml
# Check renderer and native behavior without model weights or GPU requirements.
name: Faster Whisper Transcriber checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend and browser on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: transcriber/desktop/package-lock.json }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: transcriber/engine/requirements.lock }
      - run: npm --prefix transcriber/desktop ci
      - run: bash transcriber/tests/run.sh common
      - run: bash transcriber/tests/run.sh frontend
      - working-directory: transcriber/desktop
        run: npm exec -- playwright install --with-deps webkit
      - run: bash transcriber/tests/run.sh browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: browser-failures, path: transcriber/desktop/test-results/browser/, if-no-files-found: warn }
  native:
    name: Runtime and native GUI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, macos-15] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: transcriber/desktop/package-lock.json }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: transcriber/engine/requirements.lock }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb dbus-daemon
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with: { workspaces: 'transcriber/desktop/src-tauri -> target' }
      - run: npm --prefix transcriber/desktop ci
      - run: bash transcriber/tests/run.sh runtime
      - run: bash transcriber/tests/run.sh native
        env: { LIBGL_ALWAYS_SOFTWARE: '1', WEBKIT_DISABLE_COMPOSITING_MODE: '1' }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: 'native-${{ matrix.os }}', path: transcriber/desktop/test-results/native/, if-no-files-found: warn }
